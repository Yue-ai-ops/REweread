name: build Move Qt app

on:
  workflow_dispatch:
  push:
    branches:
      - "codex/**"

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Fetch QR dependency
        run: ./scripts/fetch-build-dependencies.sh

      - name: Install official chiappa SDK
        env:
          SDK_FILE: remarkable-production-image-5.7.119-chiappa-public-aarch64-toolchain.sh
          SDK_SHA256: d6e6512f812d1e1c8f721fe1cce957fec461434fd3bd04ce50ff6fdd5744e1ff
        run: |
          curl -fL --retry 3 --retry-delay 2 \
            "https://storage.googleapis.com/remarkable-codex-toolchain/3.27.0.97/chiappa/$SDK_FILE" \
            -o "$RUNNER_TEMP/$SDK_FILE"
          echo "$SDK_SHA256  $RUNNER_TEMP/$SDK_FILE" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/$SDK_FILE"
          "$RUNNER_TEMP/$SDK_FILE" -y -d "$RUNNER_TEMP/chiappa-sdk"

      - name: Build Qt application
        run: |
          source "$RUNNER_TEMP/chiappa-sdk/environment-setup-cortexa55-remarkable-linux"
          export LANG=C.UTF-8 LC_ALL=C.UTF-8
          cmake -S apps/weread-qt -B apps/weread-qt/build-ci \
            -DQRCODEGEN_SOURCE_DIR="$GITHUB_WORKSPACE/downloads/sources/QR-Code-generator-1.8.0"
          cmake --build apps/weread-qt/build-ci -j2
          file apps/weread-qt/build-ci/rm_weread_qt
          sha256sum apps/weread-qt/build-ci/rm_weread_qt > apps/weread-qt/build-ci/rm_weread_qt.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: rm-weread-qt-move
          path: |
            apps/weread-qt/build-ci/rm_weread_qt
            apps/weread-qt/build-ci/rm_weread_qt.sha256
          if-no-files-found: error
          retention-days: 7
